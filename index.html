<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pak Jobs - All Pakistan Official Live Employment Portal</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #060c21;
            color: #ffffff;
            min-height: 100vh;
        }
        
        /* Premium Navigation Bar */
        .navbar {
            background-color: #001133;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 3px solid #f59e0b;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #f59e0b;
            text-transform: uppercase;
        }
        .logo i { color: #f59e0b; margin-right: 5px; }
        .nav-btn {
            background-color: #f59e0b;
            color: #001133;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            border: none;
        }

        /* Hero Banner & Live Target Filters */
        .hero {
            background: linear-gradient(rgba(0, 17, 51, 0.92), rgba(6, 12, 33, 0.98)), url('https://unsplash.com') no-repeat center center/cover;
            padding: 40px 15px;
            text-align: center;
        }
        .hero h1 { font-size: 26px; font-weight: 800; margin-bottom: 5px; }
        .hero h1 span { color: #f59e0b; }
        .hero p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        
        .search-box {
            background: #001133;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #f59e0b;
            max-width: 100%;
        }
        .search-box input, .search-box select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 6px;
            background: #060c21;
            color: white;
            border: 1px solid #1e293b;
            font-size: 14px;
        }
        .search-box button {
            width: 100%;
            background: #f59e0b;
            color: #001133;
            padding: 14px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Adsense Space */
        .ad-banner {
            background: #111e38;
            border: 2px dashed #f59e0b;
            margin: 20px 15px;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            color: #94a3b8;
            font-size: 13px;
        }
        .ad-banner span { color: #f59e0b; display: block; font-weight: bold; margin-bottom: 4px; }

        /* Headings */
        .section-title {
            font-size: 20px;
            margin: 25px 15px 12px;
            color: #f59e0b;
            border-left: 5px solid #f59e0b;
            padding-left: 8px;
        }

        /* 100% Fully Populated Cities Grid Stream */
        .job-container { padding: 0 15px; }
        .job-card {
            background: #001133;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            border-left: 6px solid #ef4444; /* Red for Pak Army / Govt */
            position: relative;
        }
        .job-card.school { border-left-color: #10b981; } /* Green for School */
        .job-card.private { border-left-color: #3b82f6; } /* Blue for Private */
        
        .job-card h3 { font-size: 17px; margin-bottom: 6px; color: #ffffff; }
        .company { color: #f59e0b; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
        .city-tag { color: #94a3b8; font-size: 13px; margin-bottom: 12px; }
        .city-tag i { color: #f59e0b; margin-right: 4px; }
        
        .apply-btn {
            display: block;
            background: #f59e0b;
            color: #001133;
            text-align: center;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* WORKING POPUP MODAL FOR LOGIN & REGISTRATION */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box {
            background: #001133;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #f59e0b;
            width: 90%;
            max-width: 400px;
            position: relative;
        }
        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            color: #94a3b8;
            cursor: pointer;
        }
        .modal-box h3 { color: #f59e0b; margin-bottom: 15px; text-align: center; }
        .modal-box input, .modal-box select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #060c21;
            color: white;
            border: 1px solid #1e293b;
            border-radius: 6px;
        }
        .modal-box button {
            width: 100%;
            background: #f59e0b;
            color: #001133;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }
        .toggle-text { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 12px; cursor: pointer; }
        .toggle-text span { color: #f59e0b; text-decoration: underline; }

        /* Persistent Live Helpline */
        .helpline-box {
            background: #001133;
            margin: 20px 15px;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #25d366;
            text-align: center;
        }
        .hl-btn {
            display: inline-block;
            background: #25d366;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            margin-top: 10px;
        }

        footer {
            background: #001133;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 40px;
            border-top: 2px solid #f59e0b;
        }
    </style>
</head>
